services:
  - type: web
    name: shopee-viral-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopee-viral-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPEE_CONSUMER_KEY
        sync: false
      - key: SHOPEE_CONSUMER_SECRET
        sync: false
      - key: SHOPEE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COMMISSION_RATE
        value: "0.10"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health

databases:
  - name: shopee-viral-db
    databaseName: shopee_viral
    user: shopee_viral
    plan: free
